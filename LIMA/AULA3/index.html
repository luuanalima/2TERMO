<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icone Favorito -->
    <link rel="shortcut icon" href="imagens/favicons.png" type="image/x-icon">
    <title>FAVICONS E IMAGENS</title>
</head>
<body>
    <h1>Imagens do Google</h1>
    <h2>Princess</h2>
    <div><!-- Tag para acrescentar imagens -->
     <img src="imagens/imagem_princess.png" alt="Princesa Aurora" title="Princesa Aurora" align="right" width="300px" 
        height="300px"> </div>

     <h2>Princesa - com proporção de imagens</h2>
     
     <div><img src="IMAGENS/imagem_princess.jpg" 
        alt="Serie Princesa" 
        title="Princesa Aurora" 
        width="300px" 
        height="300px"> </div>

        <h2>Princesa - com proporção de imagens com style</h2>
        <div>
            <img src="imagens/imagem_princess.png" 
            alt="Princesa Aurora" 
            title="Princesa Aurora" 
            style="margin: 20px; position: fixed; background-image:url(imagens/imagem_princess.jpg); background-size: auto; background-repeat: repeat-y; width: 300px; height: 300px;">    
        </div>
</html>
